[package]
name = "lilook-compile"
version.workspace = true
edition.workspace = true
description = "In-process typst backend for lilook: compile, probe, render."
license.workspace = true
keywords = ["typst", "lilaq", "compiler", "svg", "pdf"]
categories = ["science", "visualization"]
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# The desktop backend: read the project directory, download packages, use the
# system's fonts. Off for a build with no file system -- see `src/files.rs`.
default = ["system", "embedded-fonts"]
embedded-fonts = ["typst-kit/embedded-fonts"]
system = [
    "typst-kit/system-files",
    "typst-kit/system-packages",
    "typst-kit/universe-packages",
    "typst-kit/system-downloader",
    "typst-kit/scan-fonts",
    "typst-kit/datetime",
]

[package.metadata.release]
# Publish order: crates.io must index each crate before the next verifies
# against it.
tag = false

[dependencies]
serde_json = "1"
lilook-core = { path = "../lilook-core", version = "0.2.0" }
typst = { workspace = true }
typst-kit = { workspace = true }
typst-layout = { workspace = true }
typst-render = { workspace = true }
typst-pdf = { workspace = true }
typst-svg = { workspace = true }
typst-syntax = { workspace = true }
comemo = { workspace = true }
# `std::time::Instant::now()` panics on wasm32-unknown-unknown -- "time not
# implemented on this platform" -- and the backend times every compile. This is
# the same shim eframe uses, so it is already in the tree.
web-time = "1"

[dev-dependencies]
lilook-data = { path = "../lilook-data", version = "0.2.0" }
# Test-only: the inspector decides what `set` writes, and only a compiler can say
# whether those values are valid. `check_expr` accepting them is not enough.
lilook-ui = { path = "../lilook-ui", version = "0.2.0" }

# The MCP server reads real files, so it needs the `system` loader. Declared
# rather than assumed: `scripts/check.sh` also builds this crate for wasm32,
# where `SystemFiles` does not exist.
[[bin]]
name = "lilook-mcp"
required-features = ["system"]
