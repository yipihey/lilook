<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>lilook</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f6f6f6; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #boot { position: absolute; inset: 0; display: grid; place-items: center;
            font: 14px/1.5 system-ui, sans-serif; color: #666; text-align: center; }
  </style>
</head>
<body>
  <!-- The wasm carries typst, its fonts and the lilaq packages, so the first
       load is large and every edit after it is local. -->
  <div id="boot">loading lilook — the whole typesetter, once</div>
  <canvas id="lilook"></canvas>
  <script type="module">
    import init from "./pkg/lilook_web.js";
    init().then(() => document.getElementById("boot")?.remove())
          .catch(e => { document.getElementById("boot").textContent = "failed: " + e; });
  </script>
</body>
</html>
