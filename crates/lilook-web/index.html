<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>lilook</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f6f6f6; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #boot { position: absolute; inset: 0; display: grid; place-items: center; padding: 2rem;
            font: 15px/1.6 -apple-system, system-ui, sans-serif; color: #555; text-align: center; }
    #boot b { display: block; font-weight: 600; margin-bottom: .4rem; color: #222; }
    #bar { width: min(280px, 70vw); height: 4px; margin: .9rem auto 0; border-radius: 2px;
           background: #ddd; overflow: hidden; }
    #fill { height: 100%; width: 0; background: #4c72b0; transition: width .15s linear; }
    #detail { font-size: 13px; color: #888; margin-top: .5rem; }
  </style>
</head>
<body>
  <div id="boot">
    <div>
      <b>loading lilook</b>
      the whole typesetter, once
      <div id="bar"><div id="fill"></div></div>
      <div id="detail">fetching…</div>
    </div>
  </div>
  <canvas id="lilook"></canvas>
  <script type="module">
    const boot = document.getElementById("boot");
    const fill = document.getElementById("fill");
    const detail = document.getElementById("detail");
    const mb = n => (n / 1048576).toFixed(1) + " MB";

    // Fetched by hand rather than through `instantiateStreaming`, for two
    // reasons: a phone deserves to see that something is happening during a
    // download this size, and a failure here reports what actually went wrong
    // instead of Safari's bare "Load failed".
    // Baked in by scripts/web.sh. `content-length` is no use on its own: a
    // server that compresses reports the *compressed* size, while the stream
    // below yields decompressed bytes, and the bar would fill to 250%.
    const EXPECTED = Number("__WASM_BYTES__") || 0;

    // The faces a lilaq figure asks for: typst's default text font, its italic
    // and bold, and the maths font. The other 6 MB of typst's font set is not
    // fetched at all.
    const FONTS = [
      "LibertinusSerif-Regular.otf",
      "LibertinusSerif-Italic.otf",
      "LibertinusSerif-Bold.otf",
      "NewCMMath-Book.otf",
    ];

    async function load(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${res.status} ${res.statusText} for ${url}`);
      const encoded = res.headers.get("content-encoding");
      const total =
        EXPECTED || (encoded ? 0 : Number(res.headers.get("content-length")) || 0);
      const reader = res.body?.getReader();
      if (!reader) return await res.arrayBuffer();

      const chunks = [];
      let got = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        got += value.length;
        if (total) {
          fill.style.width = Math.min(100, (100 * got) / total).toFixed(1) + "%";
        }
        detail.textContent = total ? `${mb(got)} of ${mb(total)}` : mb(got);
      }
      const bytes = new Uint8Array(got);
      let at = 0;
      for (const c of chunks) { bytes.set(c, at); at += c.length; }
      return bytes;
    }

    try {
      // Fonts first, and in parallel: they are small, and the module is the
      // thing worth showing a bar for.
      const fonts = Promise.all(
        FONTS.map(f =>
          fetch(`./pkg/fonts/${f}`)
            .then(r => (r.ok ? r.arrayBuffer() : null))
            .then(b => (b ? new Uint8Array(b) : null))
            .catch(() => null)
        )
      );

      const bytes = await load("./pkg/lilook_web_bg.wasm");
      detail.textContent = "starting typst…";
      fill.style.width = "100%";
      const { default: init, start } = await import("./pkg/lilook_web.js");
      try {
        await init({ module_or_path: bytes });
      } catch {
        await init(bytes);
      }
      const wasm = await import("./pkg/lilook_web.js");
      start((await fonts).filter(Boolean));
      hdf5Bridge(wasm);
      boot.remove();

    // HDF5 in a browser.
    //
    // libhdf5 is C and has no wasm build, so the Rust decoders that cover npz,
    // FITS, CSV and Veusz ASCII cannot cover this one. h5wasm can -- it is
    // libhdf5 through emscripten -- and it is about a megabyte, so it is loaded
    // *only* when someone actually drops an .h5. Nobody else pays for it, and
    // the page's own cold start is unchanged.
    //
    // What goes back to Rust is plain columns: names and Float64Arrays. Rust
    // turns them into the same CBOR sidecar a native transcode produces, so the
    // rest of the feature cannot tell which route the numbers took.
    function hdf5Bridge(wasm) {
      const EXT = /\.(h5|hdf5|he5|hdf)$/i;
      let h5 = null;

      async function library() {
        if (!h5) {
          // Configurable so a deployment can vendor it rather than reach a CDN.
          const url = window.LILOOK_H5WASM_URL ||
            "https://cdn.jsdelivr.net/npm/h5wasm@0.7.8/dist/esm/hdf5_hl.js";
          const mod = await import(/* webpackIgnore: true */ url);
          await mod.ready;
          h5 = mod;
        }
        return h5;
      }

      // Every numeric dataset, groups included, named by its full path -- the
      // same naming the native reader uses so a document links the same way.
      function collect(group, prefix, names, values) {
        for (const key of group.keys()) {
          const item = group.get(key);
          if (!item) continue;
          const path = prefix + "/" + key;
          if (item.keys) {
            collect(item, path, names, values);
          } else if (item.shape && item.shape.length >= 1 && item.shape.length <= 2) {
            const v = item.value;
            // Strings and compound types come back as something other than a
            // numeric TypedArray; skip them rather than plotting nonsense.
            if (v && typeof v.length === "number" && typeof v[0] === "number") {
              if (item.shape.length === 1) {
                names.push(path);
                values.push(new Float64Array(v));
              } else {
                const [rows, cols] = item.shape;
                for (let c = 0; c < cols; c++) {
                  const col = new Float64Array(rows);
                  for (let r = 0; r < rows; r++) col[r] = v[r * cols + c];
                  names.push(path + "[" + c + "]");
                  values.push(col);
                }
              }
            }
          }
        }
      }

      async function read(file) {
        try {
          const lib = await library();
          const buffer = new Uint8Array(await file.arrayBuffer());
          // h5wasm reads through emscripten's in-memory file system.
          const tmp = "/lilook-" + Date.now() + "-" + file.name;
          lib.FS.writeFile(tmp, buffer);
          const f = new lib.File(tmp, "r");
          const names = [], values = [];
          try {
            collect(f, "", names, values);
          } finally {
            f.close();
            try { lib.FS.unlink(tmp); } catch {}
          }
          if (!names.length) {
            wasm.deliver_error(file.name, "no datasets of numbers in that file");
          } else {
            wasm.deliver_columns(file.name, names, values);
          }
        } catch (e) {
          wasm.deliver_error(file.name, "h5wasm: " + (e && e.message ? e.message : String(e)));
        }
      }

      // egui reads the same drop for every other format; this only claims the
      // extensions Rust said it could not handle.
      window.addEventListener("drop", ev => {
        const files = ev.dataTransfer && ev.dataTransfer.files;
        if (!files) return;
        for (const f of files) if (EXT.test(f.name)) read(f);
      }, true);
    }

    } catch (e) {
      const why = e && (e.stack || e.message) ? (e.name + ": " + e.message) : String(e);
      boot.innerHTML = `<div><b>could not start</b><code style="font-size:13px">${why}</code>
        <div id="detail">If this says the module is too large, the build is too big for
        this device — see the wasm-release profile in Cargo.toml.</div></div>`;
      console.error(e);
    }
  </script>
</body>
</html>
