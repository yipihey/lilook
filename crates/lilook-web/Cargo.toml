[package]
name = "lilook-web"
version.workspace = true
edition.workspace = true
license.workspace = true
keywords = ["typst", "lilaq", "wasm", "browser"]
categories = ["wasm", "visualization"]
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
# The browser shell is this repository's deployment, not a library anyone would
# depend on. Kept out of a publish so a release cannot push something meaningless.
publish = false
description = "lilook in the browser: lilaq figures edited by pointer or by text."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lilook-core = { path = "../lilook-core", version = "0.2.0" }
lilook-editor = { path = "../lilook-editor", version = "0.2.0" }
# npz, FITS and descriptor ASCII, which port to wasm unchanged because every
# decoder takes `&[u8]`. Not `hdf5`: that is C, and the page uses h5wasm instead.
lilook-data = { path = "../lilook-data", version = "0.2.0" }
# No `system` feature: there is no file system, no package downloader and no
# thread to compile on. Packages come from the bundle built in build.rs.
lilook-compile = { path = "../lilook-compile", version = "0.2.0", default-features = false }
egui = { workspace = true }
eframe = { version = "0.35", default-features = false, features = [
    "glow",
    "default_fonts",
] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Performance", "console"] }
log = "0.4"
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"
