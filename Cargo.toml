[workspace]
members = [
    "crates/lilook-core",
    "crates/lilook-data",
    "crates/lilook-ffi",
    "crates/lilook-ui",
    "crates/lilook-app",
    "crates/lilook-compile",
    "crates/lilook-editor",
    "crates/lilook-web",
]
exclude = ["spikes/inprocess-world"]
resolver = "2"

# Versions live here so `typst-syntax` cannot drift from the parser the `typst`
# crate links against. Two parsers in one binary means two `SyntaxKind` types,
# and the mismatch only shows up as a confusing trait error at the seam.
[workspace.package]
# One version for every crate. Eight independent versions is eight decisions a
# release; one is none, and the cost -- publishing a crate that did not change --
# is nothing.
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Tom Abel"]
repository = "https://github.com/yipihey/lilook"
homepage = "https://yipihey.github.io/lilook/"
# The typst 0.15 line needs this; declared so a build fails with a version
# number rather than with a page of trait errors.
rust-version = "1.92"

[workspace.dependencies]
typst = "0.15.1"
typst-syntax = "0.15.1"
typst-layout = "0.15.1"
typst-render = "0.15.1"
typst-pdf = "0.15.1"
typstyle-core = "0.15.0"
typst-svg = "0.15.1"
# Only what works everywhere; `lilook-compile`'s `system` feature adds the
# file-system, package-download and font-scanning pieces, which a wasm build
# cannot have.
typst-kit = { version = "0.15.1", default-features = false }
comemo = "0.5"
egui = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Dependencies are optimised even in dev builds. An unoptimised typst turns a
# 20 ms recompile into something the pointer outruns, and `cargo test` would
# measure the profile rather than the design.
[profile.dev.package."*"]
opt-level = 2

# The browser build. An ordinary release build is 50 MB, and almost all of it is
# code rather than data -- unwinding tables, symbol names, unmerged codegen
# units -- which is not something a phone will load. `panic = "abort"` is safe
# here because a panic in the browser already ends the session: eframe cannot
# continue after one. Thin rather than fat LTO because fat LTO on typst runs for
# the better part of an hour and `wasm-opt -Oz` does the heavy lifting anyway.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "thin"
panic = "abort"
strip = true
